name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/zizmor.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Strictest persona: enables auditor-only audits, notably
          # ref-version-mismatch, which warns when a pinned SHA drifts from
          # its `# vN` comment.
          persona: auditor
          # This repo is public, so Advanced Security/SARIF upload is available;
          # we still prefer inline annotations + a red job (self-contained gate,
          # no code-scanning ruleset needed). Flip both to enable SARIF instead.
          advanced-security: false
          annotations: true
        env:
          # ref-version-mismatch resolves tags via the GitHub API.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
