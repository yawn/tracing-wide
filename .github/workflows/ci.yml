name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.95.0"

# PRs: a new push cancels the superseded run. main: one group per commit, so a
# newer push never cancels a run whose release job may be publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      # &checkout / &rust-cache are defined here and reused via *aliases below.
      # YAML anchors are file-local and can't override fields (no merge keys), so
      # only the byte-identical steps are shared; rust-toolchain/install-action
      # vary per job and stay inline.
      - &checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - &rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      # Confirm the pin won over rust-toolchain.toml's "stable" (see RUSTUP_TOOLCHAIN).
      - run: rustc --version
      - run: just lint

  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"
      - *rust-cache
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,cargo-hack
      - run: rustc --version
      # Powerset compile-coverage of every feature combo; the test runs below
      # only exercise the no-default / all-features ends of the matrix.
      - run: just check-native
      - run: just test-native
      # trybuild's `ui` suite leaves a nested target tree under target/tests that
      # rust-cache's post-step cleanup trips over (ENOENT opendir). Drop it here;
      # the docs / test-examples steps below don't need it.
      - run: rm -rf target/tests
      - run: just docs
      - run: just test-examples

  wasm:
    name: test (wasm32)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown
      - *rust-cache
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just,cargo-hack,wasm-bindgen-cli@0.2.122
      - run: just check-wasm
      - run: just test-wasm

  # The release jobs live here, gated by `needs:`, because crates.io refuses
  # trusted publishing from a `workflow_run` trigger. On crates.io, both crates
  # trust workflow ci.yml in environment `release`. A push checkout is on main
  # at the commit CI tested.

  # Maintains the release PR: bumps the workspace version + the macros `=` pin.
  # Never publishes. (changelog_update is off: CHANGELOG.md is hand-written.)
  release-pr:
    name: release-plz PR
    needs: [lint, test, wasm]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release-PR branch
      pull-requests: write # open/update the release PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - &checkout-history
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      # 1.95.0, not stable: cargo-semver-checks reads only the rustdoc JSON
      # formats it knows (0.51: v57/v60/v61); a newer stable fails the check.
      - &toolchain-release
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the release PR merges: publishes the unpublished crates (macros first)
  # via OIDC trusted publishing and pushes the tags (git_release_enable is off).
  # A no-op on every other push, until a version bump reaches main.
  release:
    name: release-plz release
    needs: [lint, test, wasm]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # crates.io trusts ci.yml only in this environment, and the environment
    # admits only main: a branch that edits ci.yml can't mint a publish token.
    environment: release
    permissions:
      contents: write # push the tags
      pull-requests: read # detect the merged release PR
      id-token: write # OIDC -> crates.io trusted publishing; no token secret
    concurrency:
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout-history
      - *toolchain-release
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
