[package]
# `tests/common.rs` holds shared fixtures, not tests — auto-discovery would
# build it as a test target of its own, so every target below is listed.
autotests = false
description = "Wide structured events for tokio `tracing`: define a struct per event and emit all observability-relevant fields at one site."
name = "tracing-wide"
readme = "README.md"
# The tests need `integration-test-crate`, a path-only dev-dependency Cargo
# strips on publish: they could never build from the package.
exclude = ["/tests"]

edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = [ "std" ]

## Builds the full rustdoc (docs.rs, `just docs`); never needed by applications or libraries.
docs = ["dep:document-features"]

## The catalogue of every message type; with `serde`, its descriptors are `Serialize`.
##
## Enable it where an application reads the catalogue: tests, lookups, or manifest generation in an xtask or a bin;
## never in a library.
catalogue = ["dep:inventory", "std"]

## `Message::as_facet`: a `facet::Peek` over a live message whose type derives `Facet`, to read fields by name.
##
## Unstable: tracks facet, where every minor version breaks. Specify facet types through the `tracing_wide::facet` re-export.
facet = ["dep:facet", "std"]

## Ambient autocapture: `event!` fills still-`None` `Option` fields from the span scope. Needs
## `instrument::layer()` on a `tracing_subscriber::registry()` stack; without it, the fields stay `None`.
##
## Application-only feature. Should only be enabled for applications, not for libraries.
instrument = ["dep:tracing-subscriber", "std"]

## `Message::as_serialize` for a message whose type derives `Serialize`; with `catalogue`, the descriptors are
## `Serialize` too.
serde = ["dep:serde", "dep:erased-serde", "std"]

## Typed `&dyn Message` fan-out to registered sinks before the tracing handoff.
##
## Application-only feature. Should only be enabled for applications, not for libraries.
sink = ["std"]

## Opt-in std - required for all features beyond core functionality.
std = ["tracing/std"]

[dependencies]
tracing-wide-macros.workspace = true

document-features = { version = "0.2", optional = true }
erased-serde = { version = "0.4", optional = true }
facet = { version = "0.46", optional = true, features = ["reflect"] }
inventory = { version = "0.3", optional = true }
serde = { version = "1.0", optional = true, features = ["derive"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["registry", "std"] }

[dev-dependencies]
integration-test-crate = { path = "../integration-test-crate" }
seq-macro = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = { version = "0.1", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
facet-json = "0.46"
facet-yaml = "0.46"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry-stdout = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde_norway = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
trybuild = "1.0"
trycmd = "1.2"

[[example]]
name = "catalogue-facet"
required-features = ["catalogue", "facet"]

[[example]]
name = "catalogue-serde"
required-features = ["catalogue", "serde"]

[[example]]
name = "instrument"
required-features = ["instrument", "sink"]

[[example]]
name = "metrics"
required-features = ["sink"]

[[example]]
name = "sink"
required-features = ["sink"]

[[example]]
name = "sink-facet"
required-features = ["facet", "sink"]

[[example]]
name = "sink-serde"
required-features = ["serde", "sink"]

[[example]]
name = "tags"
required-features = ["sink"]

[[test]]
name = "catalogue"

[[test]]
name = "core"

[[test]]
name = "cross_crate"

[[test]]
name = "examples"

[[test]]
name = "facet"

[[test]]
name = "instrument"

[[test]]
name = "serde"

[[test]]
name = "sink"

[[test]]
name = "ui"

[package.metadata.docs.rs]
features = ["catalogue", "docs", "facet", "instrument", "serde", "sink", "std" ]
